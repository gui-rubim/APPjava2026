plugins {
    id 'com.android.application'
}

android {
    namespace 'com.promptplace'
    compileSdk 34

    defaultConfig {
        applicationId "com.promptplace"
        minSdk 26          // Android 8.0 ou mais novo
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// Sem bibliotecas extras: só o Android puro + Java.
